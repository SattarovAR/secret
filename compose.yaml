services:
  app:
    build: .
    restart: always
    expose:
      - "3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-team}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TIME_ZONE: ${TIME_ZONE:-Europe/Moscow}
      DEFAULT_TTL: ${DEFAULT_TTL:-86400}
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - secret_data:/data
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true

volumes:
  secret_data:
